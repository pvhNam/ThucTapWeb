name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build WAR with Gradle
        run: |
          gradle clean war --no-daemon
          ls -lah build/libs

      - name: Create deploy folder on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/deploy
            mkdir -p /home/ubuntu/migrations

      - name: Upload WAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/libs/*.war"
          target: "/home/ubuntu/deploy/"
          strip_components: 2

      - name: Upload migration files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "migrations/*.sql"
          target: "/home/ubuntu/migrations/"
          strip_components: 1

      - name: Run DB migrations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            DB_USER="${{ secrets.DB_USER }}"
            DB_NAME="${{ secrets.DB_NAME }}"

            if [ -z "$DB_USER" ]; then
              DB_USER="admin"
            fi

            if [ -z "$DB_NAME" ]; then
              DB_NAME="ltweb"
            fi

            if ls /home/ubuntu/migrations/*.sql >/dev/null 2>&1; then
              for f in $(ls /home/ubuntu/migrations/*.sql | sort); do
                echo "Running migration: $f"
                mysql -u "$DB_USER" -p"${{ secrets.DB_PASSWORD }}" "$DB_NAME" < "$f"
              done
            else
              echo "No migration files found."
            fi

      - name: Deploy WAR to Tomcat
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            WAR_FILE=$(ls /home/ubuntu/deploy/*.war | head -n 1)

            if [ -z "$WAR_FILE" ]; then
              echo "WAR file not found!"
              exit 1
            fi

            echo "Deploying WAR: $WAR_FILE"

            sudo systemctl stop tomcat10 || true

            sudo rm -rf /var/lib/tomcat10/webapps/ROOT
            sudo rm -f /var/lib/tomcat10/webapps/ROOT.war

            sudo cp "$WAR_FILE" /var/lib/tomcat10/webapps/ROOT.war

            sudo systemctl start tomcat10
            sudo systemctl status tomcat10 --no-pager